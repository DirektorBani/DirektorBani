name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main, master, dev]

permissions:
  contents: write

jobs:
  metrics:
    name: Generate profile metrics
    runs-on: ubuntu-latest
    steps:
      - name: GitHub metrics as SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: Europe/Moscow
          config_display: large
          config_animations: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: >-
            html,
            css,
            scss,
            json,
            yaml,
            markdown,
            dockerfile,
            makefile
          plugin_achievements: yes
          plugin_achievements_limit: 0
          plugin_achievements_secrets: yes
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_timestamps: yes
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_followup_limit: 5
          plugin_repositories: yes
          plugin_repositories_featured: DirektorBani/DataSafeS3
          plugin_stargazers: yes
          plugin_stargazers_limit: 4
          plugin_notable: yes
          plugin_notable_repositories: yes
          plugin_notable_limit: 4
          plugin_notable_filter: stars:>5
